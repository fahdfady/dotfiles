# --- Cursor: opacity + blur (only VS Code) ---
# Match the app by its class (regex) and set both active & inactive opacity
windowrule = opacity 0.95 0.95 override, match:class ^(antigravity)$

# Only apply blur to the listed apps (use the app "class" or name)
blurls = antigravity

# Global decoration / blur settings (applies only to apps listed in blurls)
decoration {
    blur {
        enabled = true
        size = 2          # blur strength — raise/lower as you like
        passes = 3        # increase if blur looks wrong at high size
        new_optimizations = true
        ignore_opacity = true
    }
}

# Local keybind overrides (kept here since this file is not a dotfiles symlink).
source=mic-mute.conf
